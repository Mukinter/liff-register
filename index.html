<script>
        const LIFF_ID = "2012138789-CSrjHxtK"; // LIFF ID ของคุณ
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz7h8L1zscYjxwHnrdzM5YE_UFGIhVQwRmkxLJPLq38iTI35iAC9c6fW31YNq706P1Cyg/exec"; // URL Google Apps Script

        window.onload = function() {
            showLoading("กำลังเตรียมระบบ...");
            initializeLiff();
        };

        function showLoading(text) {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function initializeLiff() {
            liff.init({ liffId: LIFF_ID }).then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    hideLoading(); // ซ่อนหน้าโหลดเมื่อพร้อมใช้งาน
                }
            }).catch(err => {
                hideLoading();
                console.error('Failed to init LIFF', err);
                alert("LIFF Initialization failed: " + err);
            });
        }

        document.getElementById('regisForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const empCode = document.getElementById('empCode').value;
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            // ดึง LINE User ID สดๆ ตอนกดส่งเลย เพื่อความชัวร์
            if (!liff.isLoggedIn()) {
                alert("กรุณาล็อกอิน LINE ก่อนใช้งาน");
                liff.login();
                return;
            }

            showLoading("กำลังดึงข้อมูล LINE...");

            liff.getProfile().then(profile => {
                const lineId = profile.userId;
                
                if (!lineId) {
                    hideLoading();
                    alert("ไม่พบข้อมูล LINE User ID กรุณาปิดแล้วเปิดใหม่อีกครั้งผ่านแอปพลิเคชัน LINE");
                    return;
                }

                // เริ่มเช็ก Line ID ใน Google Sheets
                showLoading("กำลังตรวจสอบข้อมูล...");

                fetch(WEB_APP_URL + "?action=checkLineId&lineId=" + encodeURIComponent(lineId))
                .then(response => response.json())
                .then(data => {
                    hideLoading();

                    if (data.isExist) {
                        let confirmUpdate = confirm("ไลน์นี้เคยลงทะเบียนแล้วข้อมูลเก่าจะหายไป คุณต้องการแก้ไขข้อมูลหรือไม่");
                        if (confirmUpdate) {
                            submitData(lineId, empCode, fullName, email, phone, true);
                        } else {
                            liff.closeWindow();
                        }
                    } else {
                        submitData(lineId, empCode, fullName, email, phone, false);
                    }
                })
                .catch(error => {
                    hideLoading();
                    alert("เกิดข้อผิดพลาดในการเชื่อมต่อระบบ: " + error);
                });

            }).catch(err => {
                hideLoading();
                console.error('Error getting profile: ', err);
                alert("ไม่สามารถดึงข้อมูลโปรไฟล์ LINE ได้ กรุณาลองใหม่อีกครั้ง");
            });
        });

        function submitData(lineId, empCode, fullName, email, phone, isOverwrite) {
            showLoading("กำลังบันทึกข้อมูล...");

            const payload = {
                lineId: lineId,
                empCode: empCode,
                fullName: fullName,
                email: email,
                phone: phone,
                isOverwrite: isOverwrite
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                hideLoading();

                if (result.status === "success") {
                    alert("บันทึกข้อมูลสำเร็จ!");
                    liff.closeWindow();
                } else {
                    alert(result.message);
                }
            })
            .catch(error => {
                hideLoading();
                alert("เกิดข้อผิดพลาด: " + error);
            });
        }
    </script>
