<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนพนักงาน</title>
    <!-- โหลด LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            font-size: 18px; /* ขยายฟอนต์พื้นฐานให้ใหญ่ขึ้น */
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #06C755;
            font-size: 26px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 18px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 18px; /* ขยายขนาดช่องกรอก */
        }
        button {
            width: 100%;
            background-color: #06C755;
            color: white;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 20px; /* ขยายปุ่มให้กดง่าย */
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #05b34c;
        }
        #loading {
            text-align: center;
            display: none;
            font-size: 18px;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ลงทะเบียนพนักงาน</h2>
        <form id="regisForm">
            <input type="hidden" id="lineId" name="lineId">
            
            <div class="form-group">
                <label for="empCode">รหัสพนักงาน:</label>
                <input type="text" id="empCode" name="empCode" required placeholder="กรอกรหัสพนักงาน">
            </div>

            <div class="form-group">
                <label for="fullName">ชื่อ-นามสกุล:</label>
                <input type="text" id="fullName" name="fullName" required placeholder="กรอกชื่อและนามสกุล">
            </div>

            <div class="form-group">
                <label for="email">อีเมล:</label>
                <input type="email5" id="email" name="email" required placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label for="phone">เบอร์โทรศัพท์:</label>
                <input type="tel" id="phone" name="phone" required placeholder="0812345678">
            </div>

            <button type="submit" id="submitBtn">ยืนยันการลงทะเบียน</button>
        </form>
        <div id="loading">กำลังตรวจสอบและบันทึกข้อมูล...</div>
    </div>

    <script>
        const LIFF_ID = "YOUR_LIFF_ID"; // ใส่ LIFF ID ของคุณ
        const WEB_APP_URL = "YOUR_APPS_SCRIPT_URL"; // ใส่ URL ของ Google Apps Script

        window.onload = function() {
            initializeLiff();
        };

        function initializeLiff() {
            liff.init({ liffId: LIFF_ID }).then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    liff.getProfile().then(profile => {
                        document.getElementById('lineId').value = profile.userId;
                    }).catch(err => {
                        console.error('Error getting profile: ', err);
                    });
                }
            }).catch(err => {
                console.error('Failed to init LIFF', err);
            });
        }

        document.getElementById('regisForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const lineId = document.getElementById('lineId').value;
            const empCode = document.getElementById('empCode').value;
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            if (!lineId) {
                alert("ไม่พบข้อมูล LINE User ID กรุณาเปิดผ่านแอปพลิเคชัน LINE เท่านั้น");
                return;
            }

            // ขั้นตอนที่ 1: เช็กว่า Line ID นี้เคยลงทะเบียนหรือยัง
            document.getElementById('loading').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;

            fetch(WEB_APP_URL + "?action=checkLineId&lineId=" + encodeURIComponent(lineId))
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;

                if (data.isExist) {
                    // ถ้าเคยลงทะเบียนแล้ว ให้ถามยืนยัน
                    let confirmUpdate = confirm("ไลน์นี้เคยลงทะเบียนแล้วข้อมูลเก่าจะหายไป คุณต้องการแก้ไขข้อมูลหรือไม่");
                    if (confirmUpdate) {
                        // ส่งข้อมูลไปบันทึก (โดยอนุญาตให้บันทึกทับ/เช็ครหัสพนักงานต่อ)
                        submitData(lineId, empCode, fullName, email, phone, true);
                    } else {
                        // กดยกเลิก ปิดหน้าต่างทันที
                        liff.closeWindow();
                    }
                } else {
                    // ถ้ายังไม่เคยลงทะเบียน ส่งข้อมูลไปบันทึกปกติ
                    submitData(lineId, empCode, fullName, email, phone, false);
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อระบบ: " + error);
            });
        });

        function submitData(lineId, empCode, fullName, email, phone, isOverwrite) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;

            const payload = {
                lineId: lineId,
                empCode: empCode,
                fullName: fullName,
                email: email,
                phone: phone,
                isOverwrite: isOverwrite
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;

                if (result.status === "success") {
                    alert("บันทึกข้อมูลสำเร็จ!");
                    liff.closeWindow();
                } else {
                    alert(result.message); // เช่น กรณีรหัสพนักงานซ้ำกับคนอื่น
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
                alert("เกิดข้อผิดพลาด: " + error);
            });
        }
    </script>
</body>
</html>
