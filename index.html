<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนพนักงาน</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; font-size: 18px; }
        .container { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #06C755; font-size: 26px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; font-size: 18px; }
        input { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 18px; }
        button { width: 100%; background-color: #06C755; color: white; padding: 16px; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; color: white; font-size: 20px; font-weight: bold; }
        .spinner { width: 50px; height: 50px; border: 6px solid #f3f3f3; border-top: 6px solid #06C755; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">กำลังบันทึกข้อมูล...</div>
    </div>

    <div class="container">
        <h2>ลงทะเบียนพนักงาน</h2>
        <form id="regisForm">
            <div class="form-group">
                <label>รหัสพนักงาน:</label>
                <input type="text" id="empCode" required>
            </div>
            <div class="form-group">
                <label>ชื่อ-นามสกุล:</label>
                <input type="text" id="fullName" required>
            </div>
            <div class="form-group">
                <label>อีเมล:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>เบอร์โทรศัพท์:</label>
                <input type="tel" id="phone" required>
            </div>
            <button type="submit">ยืนยันการลงทะเบียน</button>
        </form>
    </div>

    <script>
        const LIFF_ID = "2012138789-CSrjHxtK"; 
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz7h8L1zscYjxwHnrdzM5YE_UFGIhVQwRmkxLJPLq38iTI35iAC9c6fW31YNq706P1Cyg/exec";

        window.onload = function() {
            liff.init({ liffId: LIFF_ID }).then(() => {
                if (!liff.isLoggedIn()) { liff.login(); }
            });
        };

        document.getElementById('regisForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            document.getElementById('loadingOverlay').style.display = 'flex';

            let lineId = "";
            try {
                const token = liff.getDecodedIDToken();
                if (token && token.sub) lineId = token.sub;
            } catch (err) {}

            if (!lineId) {
                liff.getProfile().then(profile => {
                    submitData(profile.userId);
                }).catch(err => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    alert("ไม่สามารถดึงข้อมูล LINE ได้");
                });
            } else {
                submitData(lineId);
            }
        });

        function submitData(lineId) {
            const empCode = document.getElementById('empCode').value;
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            const url = `${WEB_APP_URL}?lineId=${encodeURIComponent(lineId)}&empCode=${encodeURIComponent(empCode)}&fullName=${encodeURIComponent(fullName)}&email=${encodeURIComponent(email)}&phone=${encodeURIComponent(phone)}`;

            fetch(url)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loadingOverlay').style.display = 'none';
                if (data.status === "success") {
                    alert("บันทึกข้อมูลสำเร็จ!");
                    liff.closeWindow();
                } else {
                    alert("เกิดข้อผิดพลาด: " + data.message);
                }
            })
            .catch(error => {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert("เชื่อมต่อล้มเหลว: " + error.message);
            });
        }
    </script>
</body>
</html>
